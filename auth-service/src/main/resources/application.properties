spring.application.name=Auth Service
server.port=8081

# ==================== Logging ====================
logging.level.root=INFO
logging.level.com.apps.authservice=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{5}:%line - %msg%n

# ==================== Swagger/OpenAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# ==================== Google OAuth2 Client ====================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id.apps.googleusercontent.com}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ==================== JWT Configuration ====================
# IMPORTANT: this secret MUST be identical to quantity-service's app.jwt.secret,
# since quantity-service validates tokens issued here using the same key.
app.jwt.secret=${JWT_SECRET:your-random-secret}
app.jwt.expiration=86400000

# ==================== App Frontend Configuration ====================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ==================== Security Public Paths ====================
app.security.public-paths=/api/auth/login,/oauth2/**,/login/**,/swagger-ui/**,/swagger-ui.html,/api-docs/**,/actuator/health,/error
