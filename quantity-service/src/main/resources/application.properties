spring.application.name=Quantity Service
server.port=8082

# ==================== JPA Configuration ====================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== H2 Database (own DB - not shared with auth-service) ====================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:file:./data/quantityservicedb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==================== Connection Pool ====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==================== Logging ====================
logging.level.root=INFO
logging.level.com.apps.quantityservice=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{5}:%line - %msg%n

# ==================== Swagger/OpenAPI ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always

# ==================== JWT Configuration ====================
# IMPORTANT: this secret MUST be identical to auth-service's app.jwt.secret,
# so tokens issued by auth-service validate here without any network call.
app.jwt.secret=${JWT_SECRET:your-random-secret}

# ==================== Security Public Paths ====================
app.security.public-paths=/swagger-ui/**,/swagger-ui.html,/api-docs/**,/actuator/health,/h2-console/**,/error
