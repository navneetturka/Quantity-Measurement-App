<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Quantity Measurement</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">

    <!-- ============ APP CARD ============ -->
    <main class="app-card">

      <!-- Header -->
      <header class="app-header">
        <h1>Welcome To Quantity Measurement</h1>

        <div class="auth-box" id="authBox">
          <!-- Logged out state -->
          <button class="btn-google" id="loginBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true">
              <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
              <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
              <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/>
              <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
            </svg>
            Sign in with Google
          </button>

          <!-- Logged in state -->
          <div class="user-chip hidden" id="userChip">
            <img id="userAvatar" src="" alt="" referrerpolicy="no-referrer" />
            <span id="userName"></span>
            <button class="btn-logout" id="logoutBtn" type="button" title="Sign out">⎋</button>
          </div>
        </div>
      </header>

      <!-- Gate: shown only when signed out -->
      <section class="signin-gate hidden" id="signinGate">
        <p>Sign in with your Google account to start measuring, converting, and comparing quantities.</p>
      </section>

      <!-- Everything below requires auth -->
      <div class="app-body hidden" id="appBody">

        <!-- Choose type -->
        <section class="field-group">
          <span class="field-label">Choose Type</span>
          <div class="type-grid" id="typeGrid" role="tablist">
            <button class="type-card active" data-type="LengthUnit" type="button">
              <span class="type-icon icon-length">📏</span>
              <span>Length</span>
            </button>
            <button class="type-card" data-type="WeightUnit" type="button">
              <span class="type-icon icon-weight">⚖️</span>
              <span>Weight</span>
            </button>
            <button class="type-card" data-type="TemperatureUnit" type="button">
              <span class="type-icon icon-temp">🌡️</span>
              <span>Temperature</span>
            </button>
            <button class="type-card" data-type="VolumeUnit" type="button">
              <span class="type-icon icon-volume">🥤</span>
              <span>Volume</span>
            </button>
          </div>
        </section>

        <!-- Choose action -->
        <section class="field-group">
          <span class="field-label">Choose Action</span>
          <div class="action-row" id="actionRow" role="tablist">
            <button class="action-btn active" data-action="compare" type="button">Comparison</button>
            <button class="action-btn" data-action="convert" type="button">Conversion</button>
            <button class="action-btn" data-action="arithmetic" type="button">Arithmetic</button>
          </div>
        </section>

        <!-- Comparison / Conversion form -->
        <section class="form-row two-col" id="fromToForm">
          <div class="input-block">
            <label id="fromLabel" for="fromValue">From</label>
            <input type="number" id="fromValue" step="any" inputmode="decimal" placeholder="0" />
            <select id="fromUnit"></select>
            <p class="field-error" id="fromError"></p>
          </div>
          <div class="input-block">
            <label id="toLabel" for="toValue">To</label>
            <input type="number" id="toValue" step="any" inputmode="decimal" placeholder="0" />
            <select id="toUnit"></select>
            <p class="field-error" id="toError"></p>
          </div>
        </section>

        <!-- Arithmetic form -->
        <section class="form-row arithmetic-row hidden" id="arithmeticForm">
          <div class="input-block">
            <label for="value1">Value 1</label>
            <input type="number" id="value1" step="any" inputmode="decimal" placeholder="0" />
            <select id="unit1"></select>
            <p class="field-error" id="value1Error"></p>
          </div>

          <button class="operator-btn" id="operatorBtn" type="button" title="Change operation">+</button>

          <div class="input-block">
            <label for="value2">Value 2</label>
            <input type="number" id="value2" step="any" inputmode="decimal" placeholder="0" />
            <select id="unit2"></select>
            <p class="field-error" id="value2Error"></p>
          </div>
        </section>

        <!-- Result -->
        <section class="result-panel hidden" id="resultPanel">
          <span class="result-label" id="resultLabel">Result</span>
          <div class="result-row">
            <span class="result-value" id="resultValue">—</span>
            <select class="result-unit hidden" id="resultUnit"></select>
          </div>
        </section>

        <!-- History (embedded via iframe) -->
        <section class="history-section">
          <button class="history-toggle" id="historyToggle" type="button">
            <span>View History</span>
            <span class="chev" id="historyChev">▾</span>
          </button>
          <div class="history-wrap hidden" id="historyWrap">
            <iframe id="historyFrame" src="history.html" title="Operation history" loading="lazy"></iframe>
          </div>
        </section>

      </div>
    </main>

    <p class="hint-line" id="apiHint"></p>
  </div>

<script src="script.js"></script>
</body>
</html>
