<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>History</title>
<link rel="stylesheet" href="style.css" />
<style>
  /* Scoped, lightweight styles for the iframe content only */
  html, body { background: #ffffff; }
  body { padding: 12px; font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  .hist-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }
  .hist-tab {
    border: 1px solid #e6e8f0;
    background: #f6f8fd;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 0.72rem;
    font-weight: 700;
    color: #6b7280;
    cursor: pointer;
  }
  .hist-tab.active { background: #4f5fe8; border-color: #4f5fe8; color: #fff; }

  .hist-empty {
    color: #6b7280;
    font-size: 0.82rem;
    padding: 18px 4px;
    text-align: center;
  }

  table.hist-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
  }
  .hist-table th {
    text-align: left;
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6b7280;
    border-bottom: 1px solid #e6e8f0;
    padding: 6px 8px;
    position: sticky;
    top: 0;
    background: #fff;
  }
  .hist-table td {
    padding: 7px 8px;
    border-bottom: 1px solid #f0f1f7;
    color: #1f2333;
    white-space: nowrap;
  }
  .hist-table tr.err td { color: #e5484d; }
  .hist-scroll { max-height: 300px; overflow: auto; }

  .hist-status {
    font-size: 0.72rem;
    color: #6b7280;
    margin-bottom: 8px;
  }
</style>
</head>
<body>

  <div class="hist-tabs" id="histTabs">
    <button class="hist-tab active" data-op="ADD" type="button">Add</button>
    <button class="hist-tab" data-op="SUBTRACT" type="button">Subtract</button>
    <button class="hist-tab" data-op="DIVIDE" type="button">Divide</button>
    <button class="hist-tab" data-op="CONVERT" type="button">Convert</button>
    <button class="hist-tab" data-op="COMPARE" type="button">Compare</button>
    <button class="hist-tab" data-op="__errors__" type="button">Errors</button>
  </div>

  <p class="hist-status" id="histStatus"></p>
  <div class="hist-scroll" id="histScroll"></div>

<script src="history.js"></script>
</body>
</html>
