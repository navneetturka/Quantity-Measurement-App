
app.name=QuantityMeasurementApp
app.environment=development

# repository.type: 'database' uses H2/JDBC, 'cache' uses in-memory
repository.type=database

# H2 Database
db.url=jdbc:h2:mem:quantitydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
db.username=sa
db.password=
db.driver=org.h2.Driver

# Connection Pool
db.pool.size=10
db.pool.timeout.ms=5000
db.pool.idle.timeout.ms=60000

# Schema
db.schema.auto=true
db.schema.file=db/schema.sql

# Logging
logging.level=INFO